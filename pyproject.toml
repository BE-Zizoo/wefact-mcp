[project]
name = "wefact-mcp"
version = "1.0.0"
description = "Local MCP server for the WeFact invoicing API (v2)"
readme = "README.md"
authors = [{ name = "Stefan Devroey" }]
urls = { Repository = "https://github.com/BE-Zizoo/wefact-mcp" }
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.10",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wefact-mcp = "wefact_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wefact_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

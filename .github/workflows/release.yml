name: Release

# Publishes a GitHub release whenever the version in pyproject.toml has no
# tag yet, with the Claude Desktop extension (wefact-mcp.mcpb) attached.
# Release notes come from .github/release-notes/v<version>.md
# (falls back to auto-generated notes).

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=v$(grep -m1 '^version' pyproject.toml | cut -d'\"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Claude Desktop extension
        run: python packaging/build_mcpb.py dist/wefact-mcp.mcpb
      - name: Create release if tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists, nothing to do"; exit 0
          fi
          NOTES=".github/release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" dist/wefact-mcp.mcpb --title "$TAG" --notes-file "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" dist/wefact-mcp.mcpb --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
